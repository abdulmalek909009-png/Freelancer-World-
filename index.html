async function sendForm(){const F=FORMS[tab],d={};for(const [k] of F.f){const v=$("#f_"+k).value.trim();if(!v)return toast("Please fill in all fields.");d[k]=v}

function authView(){app.innerHTML=`<div class="auth"><div class="logo">Freelancer World</div><p class="mut">Work online. Earn dollars. Get paid with PayPal.</p><div class="card"><input id="n" placeholder="Full name (sign up only)"><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password (6+ characters)"><button class="b" id="li" style="width:100%;margin-top:8px">Log in</button><button class="b o" id="su" style="width:100%;margin-top:8px">Create account</button><p id="er" style="color:#ef4565;font-size:13px"></p></div></div>`;

function view(){
