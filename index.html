if(tab=="home")return`${notes[0]?`<div class="tick2"><b>Notice</b><div><span>${esc(notes[0].text)}</span></div></div>`:""}${inst?'<button class="b o" id="ins" style="width:100%;margin-bottom:12px">Install Freelancer World app</button>':""}<div class="card pj"><h3 style="margin-bottom:12px">Our Projects</h3><div class="grid">${CATS.map(([n,p,g])=>[n,p,g,locks.includes(n)]).map(([n,p,g,l])=>`<button class="tile${l?" lk":""}" ${l?"data-lock":n=="Refer"?`data-go="refer"`:`data-cat="${n}"`}><span style="${icons[n]?"background:#fff":`background:linear-gradient(135deg,${g})`}">${icons[n]?`<img src="${icons[n]}">`:I(p,26)}</span>${n}${l?`<em>${I(P.lock,12)}</em>`:""}</button>`).join("")}</div></div>`;
if(FORMS[tab]){const F=FORMS[tab];return`<div class="card sf" style="--ac:${F.c}"><div class="row"><h3>${F.t}</h3><span class="rate">Rate: ${money(rate(tab))}</span></div><div class="pbox"><small>${F.pl}</small><div class="row"><b>${esc(cfg[tab+"_pass"]||"Not set yet")}</b><button class="cp" id="cpw">COPY</button></div></div>${F.f.map(([k,l,ph])=>`<label>${l}</label><input id="f_${k}" placeholder="${ph}" autocomplete="off">`).join("")}<button class="b sb" id="sf">${F.btn}</button><button class="b o" id="sh" style="width:100%;margin-top:8px">${F.hist}</button></div>`}
if(tab=="fhist")return`<button class="b o" data-go="${hf}" style="margin-bottom:10px">Back</button><h2>${FORMS[hf].t.replace(" Sell","")} history</h2>${subs.filter(x=>x.type==hf).map(x=>`<div class="card"><div class="row"><b>${esc(x.proof)}</b><span class="pill ${x.status}">${x.status}</span></div><p class="mut">Reward ${money(x.reward)}</p></div>`).join("")||`<div class="card mut">No submissions yet.</div>`}`;
if(tab=="support"){ensureChat();const on=agent.on,mine=agent.busyWith==U.uid,wait=on&&chat.status=="waiting"&&agent.busyWith&&!mine,closed=chat.status=="closed",nm=esc(agent.name||"Support");
const st=!on?"Offline · we'll be back soon":wait?"Please wait — our agent is helping another customer":mine||chat.status=="active"?"Chatting with "+nm:"Live · "+nm+" is online";
return`<div class="card ch"><div class="chh"><span class="dot${on?" live":""}"></span><div><b>Customer Support</b><br><small>${st}</small></div></div><div class="msgs" id="cb">${cmsgs.map(m=>m.from=="sys"?`<div class="sys">${esc(m.text)}</div>`:`<div class="m ${m.from}">${esc(m.text)}</div>`).join("")||`<div class="sys">${on?"Say hello! Our agent will reply here.":"Support is currently offline."}</div>`}</div>${closed&&!chat.review?`<div class="rv"><b>Rate our service</b><div class="stars">${[1,2,3,4,5].map(n=>`<button data-st="${n}" class="${n<=stars?"on":""}">★</button>`).join("")}</div><input id="f_rv" placeholder="Leave a comment (optional)"><button class="b" id="rvb" style="width:100%">Submit review</button></div>`:closed?`<div class="sys">Thanks for your feedback!</div>`:""}<div class="send"><input id="f_msg" placeholder="${on?"Type a message":"Support is offline"}" ${on?"":"disabled"} autocomplete="off"><button class="b" id="snd" ${on?"":"disabled"}>Send</button></div></div>`}
if(tab=="jobpost")return`<div class="card"><h3>Promote Your Business</h3><p>Grow faster with our sponsored promotion services:</p><ul class="ul"><li>Sponsored ads</li><li>Likes</li><li>Followers</li><li>Comments</li></ul><p class="mut">Want to boost your page or product? Contact our support team and we will set everything up for you.</p><button class="b" data-go="support" style="width:100%;margin-top:8px">Contact Support</button></div>`;
if(tab=="leaders"){loadLeaders();const L=lead||[],cls=["gold","silver","bronze"];return`<div class="card"><h3>Daily Leaders</h3><p class="mut">Top earners of ${lday||"yesterday"}. The board updates once a day.</p></div>${L.map((u,i)=>`<div class="card ld ${cls[i]}"><span class="rk">#${i+1}</span><span class="avt">${u.photo?`<img src="${u.photo}">`:esc((u.name||"U")[0].toUpperCase())}</span><div><b>${esc(u.name)}</b><br><small>Earned ${money(u.amt)} that day</small></div>${i?"":I(P.crown,30)}</div>`).join("")||`<div class="card mut">No results yet. Check back tomorrow.</div>`}`}
if(tab=="math"){if(!mt.q&&mt.n<10){mt.q=genQ();saveM()}
return mt.n>=10?`<div class="card"><h3>Math Earn</h3><p>All 10 tasks done! You answered <b>${mt.ok}/10</b> correctly.</p><button class="b g" id="msub" style="width:100%">Submit for review</button></div>`:`<div class="card"><h3>Math Earn</h3><p class="mut">Solve 10 questions. The admin reviews your answers and adds your earnings.</p><div class="prog"><i style="width:${mt.n*10}%"></i></div><p class="mut">Task ${mt.n+1} of 10</p><div class="mq">${mt.q.s} = ?</div><input id="f_ans" type="number" inputmode="numeric" placeholder="Your answer" autocomplete="off"><button class="b" id="mans" style="width:100%;margin-top:8px">Answer</button></div>`}
if(tab=="micro"){if(!gm.c.length)newRound();return`<div class="card"><h3>Micro Job · Match Game</h3><p class="mut">Match all the pairs to finish a task. Complete 10 tasks, then submit for admin review.</p><div class="prog"><i style="width:${Math.min(mm.t,10)*10}%"></i></div><p class="mut">Tasks completed: ${mm.t}/10</p>${mm.t>=10?`<button class="b g" id="usub" style="width:100%">Submit for review</button>`:gm.w?`<div class="sys">Task complete!</div><button class="b" id="nxt" style="width:100%">Next task</button>`:`<div class="gg">${gm.c.map((c,i)=>`<button class="gc${c.o||c.d?" on":""}" data-fl="${i}">${c.o||c.d?c.e:""}</button>`).join("")}</div>`}</div>`}
if(tab=="target"){const ok=me.gmailOk||0,cl=me.claimed||0,av=Math.floor(ok/10)-cl;return`<div class="card"><h3>Target Bonus</h3><p class="mut">Sell 10 Gmail accounts successfully and claim an extra $1.00 bonus. Repeat as many times as you like.</p><div class="prog"><i style="width:${av>0?100:ok%10*10}%"></i></div><div class="row"><b>${av>0?10:ok%10}/10 accepted Gmails</b><span class="mut">Claimed ${cl}×</span></div><button class="b g" id="claim" style="width:100%;margin-top:12px" ${av>0?"":"disabled"}>${av>0?"Claim $1.00 bonus"+(av>1?" ("+av+" available)":""):"Keep selling to unlock"}</button></div>`}
if(tab=="gift")return`<div class="card"><h3>Gift Code</h3><p class="mut">Enter a coupon code to receive a bonus. Each code can be used once per account.</p><input id="f_cc" placeholder="Enter coupon code" autocomplete="off" style="text-transform:uppercase"><button class="b" id="rd" style="width:100%;margin-top:8px">Redeem</button></div>`;
if(tab=="history")return`<h2>Withdraw history</h2>${wds.map(w=>`<div class="card"><div class="row"><b>${money(w.amount)} → ${money(w.net)}</b><span class="pill ${w.status}">${w.status}</span></div><p class="mut">${esc(w.paypal)} · ${w.createdAt?new Date(w.createdAt.seconds*1e3).toLocaleDateString():""}</p></div>`).join("")||`<div class="card mut">No withdrawals yet.</div>`}`;
if(tab=="refer"){const code=U.uid.slice(0,6).toUpperCase();return`<div class="hero"><small>Your referral code</small><big>${code}</big>Invite friends and earn bonus rewards.</div><div class="card"><p class="mut">Your invite link</p><input id="rl" readonly value="${location.origin}/?ref=${code}"><button class="b" id="cp" style="width:100%">Copy link</button><p class="mut" style="margin-top:10px">You earn 10% commission on your referral's income, added to your balance automatically.</p></div>`}
if(tab=="jobs")return`<div class="hero"><small>Available balance</small><big>${money(me.balance)}</big>Pick a job below and start earning.</div><h2>${cat?esc(cat)+" jobs":"Open jobs"}</h2>${cat?`<button class="b o" data-cat="" style="margin-bottom:10px">Show all jobs</button>`:""}${jobs.filter(j=>!cat||j.category==cat).map(j=>`<div class="card"><div class="row"><h3>${esc(j.title)}</h3><span class="price">${money(j.reward)}</span></div><p class="mut">${esc(j.category||"General")}</p><p>${esc(j.desc)}</p><button class="b" data-job="${j.id}" style="margin-top:8px">Submit work</button></div>`).join("")||`<div class="card mut">No jobs yet. Check back soon!</div>`}`;
if(tab=="work")return`<h2>My submissions</h2>${subs.map(s=>`<div class="card"><div class="row"><h3>${esc(s.jobTitle)}</h3><span class="pill ${s.status}">${s.status}</span></div><p class="mut">Reward ${money(s.reward)}</p><p>${esc(s.proof)}</p></div>`).join("")||`<div class="card mut">You haven't submitted any work yet.</div>`}`;
if(tab=="wallet"){const fee=amt*FEE;return`<div class="hero"><small>Balance</small><big>${money(me.balance)}</big>Minimum withdrawal $0.50 · PayPal only</div><div class="card"><h3>Withdraw</h3><div class="amts">${AMTS.map(a=>`<button data-amt="${a}" class="${amt==a?"on":""}" ${a>me.balance?"disabled":""}>$${a}</button>`).join("")}</div><input id="pp" type="email" placeholder="Your PayPal email" value="${esc(paypal)}"><p class="mut">Amount ${money(amt)} · Fee 5% ${money(fee)} · <b>You receive ${money(amt-fee)}</b></p><button class="b g" id="wd" style="width:100%;margin-top:8px" ${amt?"":"disabled"}>Request withdrawal</button></div><h2>History</h2>${wds.map(w=>`<div class="card"><div class="row"><b>${money(w.amount)} → ${money(w.net)}</b><span class="pill ${w.status}">${w.status}</span></div><p class="mut">${esc(w.paypal)}</p></div>`).join("")||`<p class="mut">No withdrawals yet.</p>`}`}
return`<div class="card" style="text-align:center"><span class="avt big">${avatar()}</span><br><label class="b o" style="display:inline-block;margin:10px 0">Change photo<input id="ph" type="file" accept="image/*" hidden></label><h3>${esc(me.name||"")}${BADGE}</h3><p class="mut">${esc(U.email)}</p>${inst?`<button class="b o" id="ins" style="margin:10px 8px 0 0">Install app</button>`:""}<button class="b r" id="out" style="margin-top:10px">Log out</button></div>`}
async function submitJob(id){const j=jobs.find(x=>x.id==id);const m=document.createElement("div");m.className="modal";m.innerHTML=`<div><h3>${esc(j.title)}</h3><p class="mut">Paste a link or describe your finished work.</p><textarea id="pf" rows="4"></textarea><button class="b" id="ok" style="width:100%">Send for review</button></div>`;document.body.append(m);m.onclick=e=>{if(e.target==m)m.remove()};
$("#ok").onclick=async()=>{const proof=$("#pf").value.trim();if(!proof)return;await addDoc(collection(db,"submissions"),{uid:U.uid,name:me.name||"",jobId:id,jobTitle:j.title,reward:j.reward,proof,status:"pending",createdAt:serverTimestamp()});m.remove();tab="work";draw()}}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3000)}
function success(a,net,pp){const cols=["#6c3cf0","#ff4d8d","#12c5e8","#ffb020","#18c98a"];const m=document.createElement("div");m.className="modal c";
m.innerHTML=`<div class="ok-box"><div class="conf">${Array.from({length:18},(_,i)=>`<i style="left:${i*5.6}%;background:${cols[i%5]};animation-delay:${(i%6)*.25}s"></i>`).join("")}</div><div class="tick"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><path d="M30 52l14 14 27-30"/></svg></div><h2>Request Successful!</h2><p class="mut">Your withdrawal is on its way to review. We will send it to your PayPal soon.</p><div class="sum"><div><span>Amount</span><b>${money(a)}</b></div><div><span>Fee (5%)</span><b>-${money(a-net)}</b></div><div><span>PayPal</span><b>${esc(pp)}</b></div><div class="big"><span>You receive</span><span>${money(net)}</span></div></div><button class="b" style="width:100%">Done</button></div>`;
document.body.append(m);m.onclick=e=>{if(e.target==m||e.target.tagName=="BUTTON")m.remove()}}
async function withdraw(){paypal=$("#pp").value.trim();if(!paypal.includes("@"))return toast("Please enter a valid PayPal email.");if(amt<0.5||amt>me.balance)return;const net=+(amt*(1-FEE)).toFixed(4);
await updateDoc(doc(db,"users",U.uid),{balance:+(me.balance-amt).toFixed(4)});await addDoc(collection(db,"withdrawals"),{uid:U.uid,name:me.name||"",amount:amt,fee:+(amt*FEE).toFixed(4),net,paypal,status:"pending",createdAt:serverTimestamp()});const a0=amt;amt=0;success(a0,net,paypal)}
function openNotes(){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div><h2>Notifications</h2>${notes.map(n=>`<div class="card"><p>${esc(n.text)}</p><p class="mut">${n.createdAt?new Date(n.createdAt.seconds*1e3).toLocaleString():""}</p></div>`).join("")||`<p class="mut">No notifications.</p>`}</div>`;document.body.append(m);m.onclick=e=>{if(e.target==m)m.remove();draw()};localStorage.fwSeen=Math.floor(Date.now()/1e3)+5}
let un=[];onAuthStateChanged(auth,u=>{un.forEach(f=>f());un=[];cOn=0;U=u;if(u){const t=+localStorage.fwLogin;if(!t)stamp();else if(Date.now()-t>SESS){expired=1;signOut(auth);return}}if(!u){authView();if(expired){$("#er").textContent="Session expired. Please log in again.";expired=0}return}
const q=(c,w)=>query(collection(db,c),...w);
un=[onSnapshot(doc(db,"users",u.uid),s=>{me=s.data()||me;draw();hideSplash()}),
onSnapshot(q("jobs",[orderBy("createdAt","desc")]),s=>{jobs=s.docs.map(d=>({id:d.id,...d.data()}));draw()}),
onSnapshot(collection(db,"banners"),s=>{bans={};s.docs.forEach(d=>bans[d.id]=d.data().img);draw()}),
onSnapshot(collection(db,"icons"),s=>{icons={};locks=[];agent={};s.docs.forEach(d=>{if(d.id=="_locks")locks=d.data().list||[];else if(d.id=="_cfg")cfg=d.data();else if(d.id=="_agent")agent=d.data();else icons[d.id]=d.data().img});draw()}),
onSnapshot(q("notices",[orderBy("createdAt","desc")]),s=>{notes=s.docs.map(d=>d.data());draw()}),
onSnapshot(q("submissions",[where("uid","==",u.uid)]),s=>{subs=s.docs.map(d=>d.data()).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));draw()}),
onSnapshot(q("withdrawals",[where("uid","==",u.uid)]),s=>{wds=s.docs.map(d=>d.data()).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));draw()})]})
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js");
</script></body></html>
