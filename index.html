<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freelancer World</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>"><link rel="stylesheet" href="style.css"></head><body><div id="app"></div>
<script type="module">
import {auth,db,$,money,esc} from "./firebase-config.js";
import {onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,updateProfile} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {collection,doc,setDoc,addDoc,onSnapshot,query,where,orderBy,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const AMTS=[0.5,1,1.5,3,5,10,20,30,50],FEE=0.05;
let U,me={balance:0},jobs=[],subs=[],wds=[],notes=[],tab="jobs",amt=0,paypal="";
const app=$("#app");
function authView(){app.innerHTML=`<div class="auth"><div class="logo">Freelancer World</div><p class="mut">Work online. Earn dollars. Get paid with PayPal.</p><div class="card"><input id="n" placeholder="Full name (sign up only)"><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password (6+ characters)"><button class="b" id="li" style="width:100%;margin-top:8px">Log in</button><button class="b o" id="su" style="width:100%;margin-top:8px">Create account</button><p id="er" style="color:#ef4565;font-size:13px"></p></div></div>`;
$("#li").onclick=()=>signInWithEmailAndPassword(auth,$("#e").value,$("#p").value).catch(x=>$("#er").textContent=x.code.replace("auth/","").replace(/-/g," "));
$("#su").onclick=async()=>{try{const c=await createUserWithEmailAndPassword(auth,$("#e").value,$("#p").value);await updateProfile(c.user,{displayName:$("#n").value});await setDoc(doc(db,"users",c.user.uid),{name:$("#n").value||"User",email:$("#e").value,balance:0,createdAt:serverTimestamp()})}catch(x){$("#er").textContent=x.code.replace("auth/","").replace(/-/g," ")}}}
const seen=()=>+localStorage.fwSeen||0, unread=()=>notes.filter(n=>(n.createdAt?.seconds||0)>seen()).length;
function draw(){if(!U)return;const cnt=unread();
app.innerHTML=`<header><h1>🌍 Freelancer World</h1><span class="chip">${money(me.balance)}</span><button class="bell" id="bell">🔔${cnt?`<b>${cnt}</b>`:""}</button></header><main>${view()}</main><nav>${[["jobs","💼 Jobs"],["work","✅ My Work"],["wallet","💰 Wallet"],["me","👤 Profile"]].map(([k,l])=>`<button data-t="${k}" class="${tab==k?"on":""}">${l}</button>`).join("")}</nav>`;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
$("#bell").onclick=openNotes;
document.querySelectorAll("[data-job]").forEach(b=>b.onclick=()=>submitJob(b.dataset.job));
document.querySelectorAll("[data-amt]").forEach(b=>b.onclick=()=>{amt=+b.dataset.amt;paypal=$("#pp")?.value||paypal;draw()});
if($("#wd"))$("#wd").onclick=withdraw;if($("#out"))$("#out").onclick=()=>signOut(auth)}
function view(){
if(tab=="jobs")return`<div class="hero"><small>Available balance</small><big>${money(me.balance)}</big>Pick a job below and start earning.</div><h2>Open jobs</h2>${jobs.map(j=>`<div class="card"><div class="row"><h3>${esc(j.title)}</h3><span class="price">${money(j.reward)}</span></div><p class="mut">${esc(j.category||"General")}</p><p>${esc(j.desc)}</p><button class="b" data-job="${j.id}" style="margin-top:8px">Submit work</button></div>`).join("")||`<div class="card mut">No jobs yet. Check back soon!</div>`}`;
if(tab=="work")return`<h2>My submissions</h2>${subs.map(s=>`<div class="card"><div class="row"><h3>${esc(s.jobTitle)}</h3><span class="pill ${s.status}">${s.status}</span></div><p class="mut">Reward ${money(s.reward)}</p><p>${esc(s.proof)}</p></div>`).join("")||`<div class="card mut">You haven't submitted any work yet.</div>`}`;
if(tab=="wallet"){const fee=amt*FEE;return`<div class="hero"><small>Balance</small><big>${money(me.balance)}</big>Minimum withdrawal $0.50 · PayPal only</div><div class="card"><h3>Withdraw</h3><div class="amts">${AMTS.map(a=>`<button data-amt="${a}" class="${amt==a?"on":""}" ${a>me.balance?"disabled":""}>$${a}</button>`).join("")}</div><input id="pp" type="email" placeholder="Your PayPal email" value="${esc(paypal)}"><p class="mut">Amount ${money(amt)} · Fee 5% ${money(fee)} · <b>You receive ${money(amt-fee)}</b></p><button class="b g" id="wd" style="width:100%;margin-top:8px" ${amt?"":"disabled"}>Request withdrawal</button></div><h2>History</h2>${wds.map(w=>`<div class="card"><div class="row"><b>${money(w.amount)} → ${money(w.net)}</b><span class="pill ${w.status}">${w.status}</span></div><p class="mut">${esc(w.paypal)}</p></div>`).join("")||`<p class="mut">No withdrawals yet.</p>`}`}
return`<div class="card"><h3>${esc(me.name||"")}</h3><p class="mut">${esc(U.email)}</p><button class="b r" id="out" style="margin-top:10px">Log out</button></div>`}
async function submitJob(id){const j=jobs.find(x=>x.id==id);const m=document.createElement("div");m.className="modal";m.innerHTML=`<div><h3>${esc(j.title)}</h3><p class="mut">Paste a link or describe your finished work.</p><textarea id="pf" rows="4"></textarea><button class="b" id="ok" style="width:100%">Send for review</button></div>`;document.body.append(m);m.onclick=e=>{if(e.target==m)m.remove()};
$("#ok").onclick=async()=>{const proof=$("#pf").value.trim();if(!proof)return;await addDoc(collection(db,"submissions"),{uid:U.uid,name:me.name||"",jobId:id,jobTitle:j.title,reward:j.reward,proof,status:"pending",createdAt:serverTimestamp()});m.remove();tab="work";draw()}}
async function withdraw(){paypal=$("#pp").value.trim();if(!paypal.includes("@"))return alert("Enter a valid PayPal email.");if(amt<0.5||amt>me.balance)return;const net=+(amt*(1-FEE)).toFixed(4);
await updateDoc(doc(db,"users",U.uid),{balance:+(me.balance-amt).toFixed(4)});await addDoc(collection(db,"withdrawals"),{uid:U.uid,name:me.name||"",amount:amt,fee:+(amt*FEE).toFixed(4),net,paypal,status:"pending",createdAt:serverTimestamp()});amt=0;alert("Withdrawal requested!")}
function openNotes(){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div><h2>🔔 Notifications</h2>${notes.map(n=>`<div class="card"><p>${esc(n.text)}</p><p class="mut">${n.createdAt?new Date(n.createdAt.seconds*1e3).toLocaleString():""}</p></div>`).join("")||`<p class="mut">No notifications.</p>`}</div>`;document.body.append(m);m.onclick=e=>{if(e.target==m)m.remove();draw()};localStorage.fwSeen=Math.floor(Date.now()/1e3)+5}
let un=[];onAuthStateChanged(auth,u=>{un.forEach(f=>f());un=[];U=u;if(!u)return authView();
const q=(c,w)=>query(collection(db,c),...w);
un=[onSnapshot(doc(db,"users",u.uid),s=>{me=s.data()||me;draw()}),
onSnapshot(q("jobs",[orderBy("createdAt","desc")]),s=>{jobs=s.docs.map(d=>({id:d.id,...d.data()}));draw()}),
onSnapshot(q("notices",[orderBy("createdAt","desc")]),s=>{notes=s.docs.map(d=>d.data());draw()}),
onSnapshot(q("submissions",[where("uid","==",u.uid)]),s=>{subs=s.docs.map(d=>d.data()).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));draw()}),
onSnapshot(q("withdrawals",[where("uid","==",u.uid)]),s=>{wds=s.docs.map(d=>d.data()).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));draw()})]})
</script></body></html>
