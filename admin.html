<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Freelancer World</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div>
<script type="module">
import {auth,db,$,money,esc,ADMIN_EMAIL} from "./firebase-config.js";
import {onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {collection,doc,addDoc,setDoc,deleteDoc,onSnapshot,updateDoc,increment,serverTimestamp,writeBatch,query,orderBy} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const CATS=["Facebook","Gmail","Instagram","Job Post","Leadership","Target","Refer","Gift","Math Earn","Micro Job","Data Entry","Ads View"];
const LBL={email:"Gmail",pw:"Password",uid:"UID",ck:"Cookies",user:"Username",fa:"2FA key",correct:"Correct answers",total:"Out of",tasks:"Tasks done"},DEF={gmail:.2,facebook:.05,instagram:.1,math:.01,micro:.02};
const PAGES=[["home","Home"],["gmail","Gmail"],["facebook","Facebook"],["instagram","Instagram"],["target","Target"],["gift","Gift"],["refer","Refer"],["wallet","Wallet"],["work","My Work"],["leaders","Leadership"],["math","Math Earn"],["micro","Micro Job"],["jobpost","Job Post"],["support","Support"],["jobs","Open jobs"]];
const rateOf=t=>+((D.icons.find(x=>x.id=="_cfg")||{})[t+"_rate"])||DEF[t];
let sel=null,cm=[],unM=null;
let D={chats:[],coupons:[],banners:[],icons:[],jobs:[],submissions:[],withdrawals:[],users:[],notices:[]},tab="submissions",un=[];const app=$("#app");
const T=[["submissions","Submissions"],["withdrawals","Withdrawals"],["support","Support"],["jobs","Jobs"],["rates","Rates & passwords"],["coupons","Coupons"],["banners","Banners"],["icons","Icons"],["notice","Send notice"],["users","Users"]];
function login(msg=""){app.innerHTML=`<div class="auth"><div class="logo">Admin Panel</div><div class="card"><input id="e" type="email" placeholder="Admin email"><input id="p" type="password" placeholder="Password"><button class="b" id="li" style="width:100%;margin-top:8px">Log in</button><p style="color:#ef4565">${msg}</p></div></div>`;$("#li").onclick=()=>signInWithEmailAndPassword(auth,$("#e").value,$("#p").value).catch(x=>login(x.code))}
const pend=k=>D[k].filter(x=>x.status=="pending").length,cnt=k=>k=="support"?D.chats.filter(c=>c.status=="waiting").length:k=="submissions"||k=="withdrawals"?pend(k):0;
const amtOf=s=>s.type=="math"?rateOf("math")*(+s.data.correct||0):s.type=="micro"?rateOf("micro")*(+s.data.tasks||0):s.type?rateOf(s.type):s.reward;
function draw(){const rv=$("#rp")?.value,hf=document.activeElement?.id;app.innerHTML=`<header><h1>⚙️ Admin · Freelancer World</h1><button class="b o" id="out">Log out</button></header><nav>${T.map(([k,l])=>`<button data-t="${k}" class="${tab==k?"on":""}">${l}${cnt(k)?" ("+cnt(k)+")":""}</button>`).join("")}</nav><main>${view()}</main>`;
$("#out").onclick=()=>signOut(auth);
if(rv&&$("#rp")){$("#rp").value=rv;if(hf=="rp")$("#rp").focus()}{const mb=document.querySelector(".msgs");if(mb)mb.scrollTop=mb.scrollHeight}
if($("#ag"))$("#ag").onclick=()=>{const on=(D.icons.find(x=>x.id=="_agent")||{}).on;setDoc(doc(db,"icons","_agent"),{on:!on,name:$("#an").value.trim()||"Support",busyWith:""})};
const rp=async()=>{const t=$("#rp").value.trim();if(!t)return;$("#rp").value="";await addDoc(collection(db,"chats",sel,"msgs"),{from:"admin",text:t,createdAt:serverTimestamp()});await updateDoc(doc(db,"chats",sel),{last:t,updatedAt:serverTimestamp(),status:"active"})};
if($("#rpb"))$("#rpb").onclick=rp;$("#rp")?.addEventListener("keydown",e=>{if(e.key=="Enter")rp()});document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.id));
if($("#nj"))$("#nj").onclick=addJob;if($("#sn"))$("#sn").onclick=sendNote;
document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.cp);b.textContent="Copied"});
if($("#cq"))$("#cq").onclick=async()=>{const c=$("#cn").value.trim().toUpperCase(),v=+$("#cb").value;if(!c||!(v>0))return alert("Code and bonus required");await setDoc(doc(db,"coupons",c),{bonus:v,active:true,createdAt:serverTimestamp()});alert("Coupon created ✓")};
if($("#sv"))$("#sv").onclick=async()=>{const o={};["gmail","facebook","instagram","math","micro"].forEach(t=>{o[t+"_rate"]=+$("#r_"+t).value;if($("#p_"+t))o[t+"_pass"]=$("#p_"+t).value.trim()});await setDoc(doc(db,"icons","_cfg"),o);alert("Saved ✓")};
if($("#bf"))$("#bf").onchange=async e=>{const f=e.target.files[0];if(f){await setDoc(doc(db,"banners",$("#bp").value),{img:await pic(f,900,340,"image/jpeg",.78,0),createdAt:serverTimestamp()});alert("Banner saved ✓")}};
document.querySelectorAll("[data-ic]").forEach(i=>i.onchange=async()=>{const f=i.files[0];if(f){await setDoc(doc(db,"icons",i.dataset.ic),{img:await pic(f,128,128,"image/png",1,1)});alert("Icon updated ✓")}})}
const pic=(f,w,h,t,q,fit)=>new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=w;c.height=h;const k=fit?Math.min(w/i.width,h/i.height):Math.max(w/i.width,h/i.height),dw=i.width*k,dh=i.height*k;c.getContext("2d").drawImage(i,(w-dw)/2,(h-dh)/2,dw,dh);r(c.toDataURL(t,q))};i.src=URL.createObjectURL(f)});
function view(){
if(tab=="submissions")return D.submissions.map(s=>`<div class="card"><div class="row"><h3>${esc(s.jobTitle)}</h3><span class="pill ${s.status}">${s.status}</span></div><p class="mut">${esc(s.name)} · ${money(amtOf(s))}</p>${s.data?Object.entries(s.data).map(([k,v])=>`<div class="kv"><span>${LBL[k]||k}</span><b>${esc(v)}</b><button class="cp" data-cp="${esc(v)}">Copy</button></div>`).join(""):`<p>${esc(s.proof)}</p>`}${s.status=="pending"?`<button class="b g" data-a="ok" data-id="${s.id}">Approve & pay</button> <button class="b r" data-a="no" data-id="${s.id}">Reject</button>`:""}</div>`).join("")||"<p class='mut'>Nothing here.</p>";
if(tab=="withdrawals")return D.withdrawals.map(w=>`<div class="card"><div class="row"><h3>Send ${money(w.net)}</h3><span class="pill ${w.status}">${w.status}</span></div><p class="mut">${esc(w.name)} · requested ${money(w.amount)} · fee ${money(w.fee)}</p><p><b>PayPal:</b> ${esc(w.paypal)}</p>${w.status=="pending"?`<button class="b g" data-a="paid" data-id="${w.id}">Mark paid</button> <button class="b r" data-a="refund" data-id="${w.id}">Reject & refund</button>`:""}</div>`).join("")||"<p class='mut'>Nothing here.</p>";
if(tab=="jobs")return`<div class="card"><h3>Post a job</h3><input id="jt" placeholder="Job title"><select id="jc">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><input id="jr" type="number" step="0.01" placeholder="Reward in USD"><textarea id="jd" rows="3" placeholder="Job description"></textarea><button class="b" id="nj">Post job</button></div>`+D.jobs.map(j=>`<div class="card"><div class="row"><h3>${esc(j.title)}</h3><span class="price">${money(j.reward)}</span></div><button class="b r" data-a="dj" data-id="${j.id}">Delete</button></div>`).join("");
if(tab=="rates"){const c=D.icons.find(x=>x.id=="_cfg")||{};return["gmail","facebook","instagram","math","micro"].map(t=>`<div class="card"><h3>${{gmail:"Gmail Sell",facebook:"Facebook Sell",instagram:"Instagram Sell",math:"Math Earn (per correct answer)",micro:"Micro Job (per task)"}[t]}</h3><label>Rate per accepted account (USD)</label><input id="r_${t}" type="number" step="0.01" min="0" value="${c[t+"_rate"]??DEF[t]}">${t=="math"||t=="micro"?"":`<label>Password users must use</label><input id="p_${t}" value="${esc(c[t+"_pass"]||"")}" placeholder="e.g. Abc@12345">`}</div>`).join("")+`<button class="b g" id="sv" style="width:100%">Save changes</button>`}
if(tab=="support"){const ag=D.icons.find(x=>x.id=="_agent")||{},c=D.chats.slice().sort((x,y)=>(y.updatedAt?.seconds||0)-(x.updatedAt?.seconds||0));
return`<div class="card"><h3>Agent status</h3><input id="an" placeholder="Your display name" value="${esc(ag.name||"")}"><button class="b ${ag.on?"r":"g"}" id="ag">${ag.on?"Go offline":"Go live"}</button><span class="pill ${ag.on?"approved":"rejected"}" style="margin-left:8px">${ag.on?"Live":"Offline"}</span></div>`+(sel?`<div class="card"><div class="row"><b>${esc((D.chats.find(x=>x.id==sel)||{}).name||"")}</b><span><button class="b o" data-a="bk" data-id="x">Back</button> <button class="b r" data-a="cl" data-id="${sel}">End chat</button></span></div><div class="msgs">${cm.map(m=>m.from=="sys"?`<div class="sys">${esc(m.text)}</div>`:`<div class="m ${m.from=="admin"?"user":"admin"}">${esc(m.text)}</div>`).join("")}</div><div class="send"><input id="rp" placeholder="Type a reply" autocomplete="off"><button class="b" id="rpb">Send</button></div></div>`:c.map(x=>`<div class="card"><div class="row"><b>${esc(x.name)}</b><span class="pill ${x.status=="active"?"approved":x.status=="closed"?"rejected":""}">${x.status}</span></div><p class="mut">${esc(x.last||"")}</p>${x.review?`<p>★ ${x.review.stars}/5 ${esc(x.review.text||"")}</p>`:""}<button class="b" data-a="op" data-id="${x.id}">Open chat</button></div>`).join("")||"<p class='mut'>No chats yet.</p>")}
if(tab=="coupons")return`<div class="card"><h3>Create coupon</h3><input id="cn" placeholder="Code (e.g. WELCOME1)"><input id="cb" type="number" step="0.01" placeholder="Bonus in USD"><button class="b" id="cq">Create coupon</button><p class="mut">Each user can redeem a code only once.</p></div>`+D.coupons.map(c=>`<div class="card"><div class="row"><b>${esc(c.id)}</b><span class="price">${money(c.bonus)}</span></div><button class="b r" data-a="dc" data-id="${c.id}" style="margin-top:8px">Delete</button></div>`).join("");
if(tab=="banners")return`<div class="card"><h3>Add banner</h3><p class="mut">Best size 900×340. Banners slide automatically on the home page.</p><select id="bp">${PAGES.map(([k,l])=>`<option value="${k}" ${D.banners.find(x=>x.id==k)?"selected":""}>${l} page${D.banners.find(x=>x.id==k)?" (has banner)":""}</option>`).join("")}</select><input id="bf" type="file" accept="image/*"><p class="mut">Uploading replaces the current banner for that page.</p></div>`+D.banners.map(b=>`<div class="card"><p class="mut">Shown on: ${b.id}</p><img src="${b.img}" style="width:100%;border-radius:12px"><button class="b r" data-a="db" data-id="${b.id}" style="margin-top:8px">Remove</button></div>`).join("");
if(tab=="icons")return`<p class="mut" style="margin-bottom:10px">Upload a square image for any icon. Reset brings back the default.</p>`+CATS.map(c=>{const i=D.icons.find(x=>x.id==c),lk=((D.icons.find(x=>x.id=="_locks")||{}).list||[]).includes(c);return`<div class="card"><div class="row"><b>${c}</b>${i?`<img src="${i.img}" width="44" height="44">`:'<span class="mut">Default</span>'}</div><div class="row" style="margin:8px 0"><span class="pill ${lk?"rejected":"approved"}">${lk?"Locked":"Unlocked"}</span><button class="b o" data-a="lk" data-id="${c}">${lk?"Unlock":"Lock"}</button></div><input type="file" accept="image/*" data-ic="${c}">${i?`<button class="b r" data-a="ri" data-id="${c}">Reset</button>`:""}</div>`}).join("");
if(tab=="notice")return`<div class="card"><h3>Send notice to all users</h3><textarea id="nt" rows="4" placeholder="Write your message. Users see it under the bell icon."></textarea><button class="b" id="sn">Send notice</button></div>`+D.notices.map(n=>`<div class="card"><p>${esc(n.text)}</p><button class="b r" data-a="dn" data-id="${n.id}">Delete</button></div>`).join("");
return D.users.map(u=>`<div class="card"><div class="row"><b>${esc(u.name)}</b><span class="price">${money(u.balance)}</span></div><p class="mut">${esc(u.email)}</p><p class="mut">Code ${u.id.slice(0,6).toUpperCase()}${u.refBy?" · Referred by "+esc(u.refBy):""}</p><input id="v_${u.id}" type="number" step="0.01" min="0" placeholder="Amount in USD"><button class="b g" data-a="add" data-id="${u.id}">+ Add balance</button> <button class="b r" data-a="sub" data-id="${u.id}">− Deduct</button></div>`).join("")}
async function act(a,id){const s=D.submissions.find(x=>x.id==id),w=D.withdrawals.find(x=>x.id==id);
if(a=="op"){sel=id;unM&&unM();unM=onSnapshot(query(collection(db,"chats",id,"msgs"),orderBy("createdAt")),x=>{cm=x.docs.map(d=>d.data());draw()});setDoc(doc(db,"icons","_agent"),{busyWith:id},{merge:true});updateDoc(doc(db,"chats",id),{status:"active"});return draw()}
if(a=="bk"){sel=null;unM&&unM();return draw()}
if(a=="cl"){await addDoc(collection(db,"chats",id,"msgs"),{from:"sys",text:"Chat ended. Thank you for contacting support!",createdAt:serverTimestamp()});await updateDoc(doc(db,"chats",id),{status:"closed",updatedAt:serverTimestamp()});await setDoc(doc(db,"icons","_agent"),{busyWith:""},{merge:true});sel=null;unM&&unM();return draw()}
if(a=="lk"){const cur=(D.icons.find(x=>x.id=="_locks")||{}).list||[];await setDoc(doc(db,"icons","_locks"),{list:cur.includes(id)?cur.filter(x=>x!=id):[...cur,id]});return}
if(a=="add"||a=="sub"){const v=+$("#v_"+id).value,u=D.users.find(x=>x.id==id);if(!(v>0))return alert("Enter an amount first.");if(a=="sub"&&v>u.balance)return alert("User has less balance than that.");await updateDoc(doc(db,"users",id),{balance:increment(a=="add"?v:-v)});return alert("Balance updated ✓")}
if(a=="ok"){const amt=amtOf(s),ub=D.users.find(x=>x.id==s.uid),rf=ub&&ub.refBy?D.users.find(x=>x.id!=s.uid&&x.id.slice(0,6).toUpperCase()==ub.refBy.toUpperCase()):null,b=writeBatch(db);b.update(doc(db,"submissions",id),{status:"approved"});b.update(doc(db,"users",s.uid),s.type=="gmail"?{balance:increment(amt),gmailOk:increment(1)}:{balance:increment(amt)});b.set(doc(db,"leaders",new Date().toISOString().slice(0,10)),{[s.uid]:{name:(ub&&ub.name)||"User",photo:ub&&ub.photo&&ub.photo.length<20000?ub.photo:"",amt:increment(amt)}},{merge:true});if(rf)b.update(doc(db,"users",rf.id),{balance:increment(+(amt*0.1).toFixed(4))});await b.commit()}
if(a=="no")await updateDoc(doc(db,"submissions",id),{status:"rejected"});
if(a=="paid")await updateDoc(doc(db,"withdrawals",id),{status:"paid"});
if(a=="refund"){const b=writeBatch(db);b.update(doc(db,"withdrawals",id),{status:"rejected"});b.update(doc(db,"users",w.uid),{balance:increment(w.amount)});await b.commit()}
if(a=="dj")await deleteDoc(doc(db,"jobs",id));if(a=="dn")await deleteDoc(doc(db,"notices",id));if(a=="dc")await deleteDoc(doc(db,"coupons",id));if(a=="db")await deleteDoc(doc(db,"banners",id));if(a=="ri")await deleteDoc(doc(db,"icons",id))}
async function addJob(){const t=$("#jt").value.trim(),r=+$("#jr").value;if(!t||!r)return alert("Title and reward required");await addDoc(collection(db,"jobs"),{title:t,category:$("#jc").value,reward:r,desc:$("#jd").value,createdAt:serverTimestamp()})}
async function sendNote(){const t=$("#nt").value.trim();if(t){await addDoc(collection(db,"notices"),{text:t,createdAt:serverTimestamp()});alert("Sent to all users!")}}
onAuthStateChanged(auth,u=>{un.forEach(f=>f());un=[];if(!u)return login();if(u.email!=ADMIN_EMAIL){signOut(auth);return login("This account is not an admin.")}
un=Object.keys(D).map(k=>onSnapshot(collection(db,k),s=>{D[k]=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));draw()}))})
</script></body></html>
