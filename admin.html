if(tab=="theme"){const th=D.icons.find(x=>x.id=="_theme")||{};const DEFC={v:"#6c3cf0",p:"#ff4d8d",c:"#12c5e8",a:"#ffb020",g:"#18c98a"};return`<div class="card"><h3>App theme colors</h3><p class="mut">Changes apply to the app immediately for all users.</p>${[["v","Primary (buttons, header)"],["p","Secondary (accents)"],["c","Info (blue accents)"],["a","Warning (gold accents)"],["g","Success (green, buttons)"]].map(([k,l])=>`<label>${l}</label><div class="row"><input type="color" id="th_${k}" value="${th[k]||DEFC[k]}" style="width:56px;height:40px;padding:2px;border:2px solid #e2ddff"><input id="tx_${k}" value="${th[k]||DEFC[k]}" style="flex:1"></div>`).join("")}<button class="b g" id="tsv" style="width:100%;margin-top:6px">Save theme</button> <button class="b o" id="trs" style="width:100%;margin-top:8px">Reset to default</button></div>`}
